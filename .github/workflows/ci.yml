name: PaperAudit tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Avoid accumulating stale red runs while a maintainer pushes successive fixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: |
          for src in js/*.js scripts/*.mjs; do node --check "$src"; done

      - name: Review catalog schema
        run: node scripts/validate_catalog.mjs

      - name: Python browser test dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test tools
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run all browser tests including real ES Modules served over HTTP
        env:
          PAPERAUDIT_REQUIRE_HTTP_TESTS: "1"
          PAPERAUDIT_PUBLIC_TEMPLATE_TESTS: "1"
        run: python -m pytest tests -q

      - name: Stage Pages deployment directory
        run: python scripts/build_site.py
