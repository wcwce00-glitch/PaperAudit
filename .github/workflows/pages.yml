name: Publish verified PaperAudit Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package public site only
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published site and required assets over HTTPS
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.request import Request, urlopen

          base = os.environ["SITE_URL"].rstrip("/") + "/"
          paths = [
              "",
              "assets/style.css",
              "js/app.js",
              "js/audit.js",
              "js/report.js",
              "js/template.js",
              "js/catalog.js",
              "js/library.js",
              "js/community.js",
              "js/docx-model.js",
              "js/rules-engine.js",
              "js/standards.js",
              "js/ai-local.js",
              "vendor/jszip.min.js",
              "data/approved-catalog.json",
              "examples/sample_manuscript.docx",
              "robots.txt",
              "sitemap.xml",
          ]
          last_error = None
          for attempt in range(24):
              try:
                  bodies = {}
                  for path in paths:
                      request = Request(base + path, headers={"User-Agent": "PaperAudit-Pages-Smoke-Test"})
                      with urlopen(request, timeout=15) as response:
                          body = response.read()
                          if response.status != 200:
                              raise RuntimeError(f"{path or '/'} returned HTTP {response.status}")
                      if not body:
                          raise RuntimeError(f"{path or '/'} returned an empty response")
                      bodies[path] = body

                  html = bodies[""]
                  if b"PaperAudit" not in html or b'type="module"' not in html or b"js/app.js" not in html:
                      raise RuntimeError("Published index.html is missing the PaperAudit title or ES Module entry point")
                  if b"Sitemap: https://wcwce00-glitch.github.io/PaperAudit/sitemap.xml" not in bodies["robots.txt"]:
                      raise RuntimeError("robots.txt is missing the public sitemap URL")
                  if b"<loc>https://wcwce00-glitch.github.io/PaperAudit/</loc>" not in bodies["sitemap.xml"]:
                      raise RuntimeError("sitemap.xml is missing the canonical homepage URL")
                  if b'rel="canonical"' not in html or b"og:title" not in html:
                      raise RuntimeError("Published homepage is missing canonical/Open Graph metadata")
                  if b"'wasm-unsafe-eval'" not in html or b"'unsafe-eval'" in html:
                      raise RuntimeError("WebLLM CSP must permit WebAssembly without enabling unsafe-eval")
                  app_source = bodies["js/app.js"]
                  if b"rules-engine.js" not in app_source or b"ai-local.js" not in app_source or b"docx-model.js" not in app_source:
                      raise RuntimeError("Published app is missing v0.5 semantic or AI module imports")
                  print(f"Published site verified: {base}")
                  for path in paths:
                      print(f"HTTP 200  {path or '/'}  ({len(bodies[path])} bytes)")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt < 23:
                      print(f"Public site not ready yet (attempt {attempt + 1}/24): {exc}")
                      time.sleep(5)
          else:
              raise SystemExit(f"Published-site smoke test failed: {last_error}")
          PY
